# Railway deployment config — https://docs.railway.app/reference/config-as-code
#
# IMPORTANTE: Railway lee este archivo SIEMPRE desde la raíz del repositorio,
# aunque el "Root Directory" del servicio apunte a una subcarpeta.
# En ESTA rama (claude/generarsi-railway-deploy-oppox4) la config arma el
# backend de GenerarSí (Python/Flask), que vive en la subcarpeta
# generarsi-backend/. El "Root Directory" del servicio en Railway debe estar
# seteado en: generarsi-backend
#
# El proyecto Legal Pacers (Node) se despliega desde OTRA rama con su propia
# config. NO fusionar esta rama con la principal: pisaría esa config.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# La clave de Gemini se carga en Railway → Service → Variables:
#   GEMINI_API_KEY=<tu clave>
# NUNCA se escribe en el código ni se sube a git.
